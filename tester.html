<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>אתגר הפוקימונים - סביבת בדיקות מפתחים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="firebase-config.js"></script>
    <style>
        body { font-family: 'Rubik', sans-serif; background: #e5e7eb; min-height: 100vh; margin: 0; padding: 10px; }
        .glass-panel { background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .bounce-in { animation: bounceIn 0.6s both; }
        @keyframes bounceIn { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
        
        .match-item { background: white; border: 3px solid #e5e7eb; border-radius: 12px; padding: 15px 20px; font-size: 1.25rem; font-weight: bold; cursor: pointer; transition: all 0.2s; position: relative; z-index: 10; }
        .match-item:hover { border-color: #93c5fd; transform: scale(1.05); }
        .match-item.selected { border-color: #3b82f6; background: #eff6ff; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .match-item.solved { border-color: #22c55e; background: #f0fdf4; color: #15803d; cursor: default; pointer-events: none; opacity: 0.8; }
        
        /* פוקימונים ואנימציות חנות */
        .booster-pack { width: 160px; height: 240px; border-radius: 12px; position: relative; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: transform 0.2s; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; border: 4px solid rgba(255,255,255,0.5); z-index: 10; }
        .booster-pack:hover { transform: translateY(-10px) scale(1.05); }
        .booster-pack::after { content: ''; position: absolute; top: -100%; left: -100%; width: 300%; height: 300%; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.4), transparent); transform: rotate(45deg); animation: shine 3s infinite; }
        @keyframes shine { 0% { left: -100%; } 100% { left: 100%; } }
        .pack-basic { background: linear-gradient(135deg, #9ca3af, #6b7280); color: white; }
        .pack-super { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; }
        .pack-ultra { background: linear-gradient(135deg, #eab308, #b45309); color: white; }
        .pack-title { font-size: 24px; font-weight: bold; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.5); z-index: 2; }
        .rip-open { animation: ripOpen 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes ripOpen { 0% { transform: scale(1) rotate(0deg); opacity: 1; filter: brightness(1); } 40% { transform: scale(1.2) rotate(15deg); filter: brightness(2); } 100% { transform: scale(0) rotate(-20deg); opacity: 0; filter: brightness(0); } }
        .tcg-card-container { perspective: 1000px; width: 140px; height: 196px; margin: 0 10px; cursor: pointer; }
        .tcg-card-inner { width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; position: relative; }
        .tcg-card-container.flipped .tcg-card-inner { transform: rotateY(180deg); }
        .tcg-card-cover, .tcg-card-reveal { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; border-radius: 12px; box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .tcg-card-cover { background: repeating-linear-gradient(45deg, #2563eb, #2563eb 10px, #1e40af 10px, #1e40af 20px); border: 8px solid #fcd34d; display: flex; align-items: center; justify-content: center; }
        .tcg-card-cover::after { content: '⭐'; font-size: 40px; }
        .tcg-card-reveal { background: white; transform: rotateY(180deg); display: flex; flex-direction: column; align-items: center; justify-content: center; border: 4px solid; padding: 10px; }
        
        /* כרטיסי פוקימון באוסף */
        .pokemon-card { background: white; border-radius: 12px; padding: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pokemon-card:hover { transform: translateY(-5px); }
        .rarity-common { border-bottom: 4px solid #9ca3af; }
        .rarity-rare { border-bottom: 4px solid #3b82f6; background: #eff6ff; }
        .rarity-legendary { border-bottom: 4px solid #eab308; background: #fefce8; box-shadow: 0 0 15px rgba(234,179,8,0.3); }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        
        /* אנימציות נוספות */
        .shake { animation: shake 0.4s ease-in-out both; }
        .shake-hard { animation: shakeHard 0.2s ease-in-out infinite; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        @keyframes shakeHard { 0%, 100% { transform: translateX(0) rotate(0deg); } 25% { transform: translateX(-15px) rotate(-10deg); } 75% { transform: translateX(15px) rotate(10deg); } }
    </style>
</head>
<body class="text-gray-800 flex flex-col items-center">

    <div class="w-full max-w-2xl mx-auto">
        
        <!-- פאנל השליטה לבדיקות בלבד! -->
        <div class="glass-panel p-4 mb-4 border-4 border-purple-500 bg-purple-50 sticky top-0 z-50">
            <h2 class="font-bold text-purple-800 mb-3 flex items-center gap-2">
                <span>🛠️ פאנל שליטת מפתח (סביבת בדיקות)</span>
            </h2>
            <div class="flex gap-2 flex-wrap text-sm font-medium">
                <button onclick="window.generateNewSet()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded shadow-sm">הרץ כפל</button>
                <button onclick="window.generateLongMathSet()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow-sm">הרץ חיבור ארוך</button>
                <button onclick="window.generateTriangleSet()" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded shadow-sm">הרץ משולשים</button>
                <button onclick="window.generateFractionSet()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded shadow-sm">הרץ שברים</button>
                <button onclick="window.resetTestUser()" class="bg-gray-800 hover:bg-black text-white px-4 py-2 rounded shadow-sm mr-auto">איפוס משתמש בדיקות 🗑️</button>
            </div>
        </div>

        <header class="flex flex-wrap justify-between items-center mb-6 glass-panel p-4 gap-4">
            <div class="flex flex-col gap-2">
                <div class="flex items-center gap-3">
                    <h1 class="text-2xl font-bold text-gray-700">תצוגת האפליקציה</h1>
                    <div id="timer-display" class="hidden text-base font-bold bg-purple-100 text-purple-800 px-3 py-1.5 rounded-full flex items-center gap-1">⏱️ <span id="time-text">00:00</span></div>
                </div>
                <div class="text-sm font-bold text-purple-800 bg-purple-200 px-3 py-1 rounded-full flex items-center gap-1">
                    👤 <span id="player-name-display">...</span>
                </div>
            </div>
            
            <div class="text-lg font-bold bg-blue-100 text-blue-800 px-4 py-2 rounded-full shadow-inner flex flex-col items-center">
                <span>⭐ <span id="score-display">0</span></span>
            </div>
        </header>

        <div id="cloud-sync-indicator" class="text-center text-xs text-gray-500 mb-2 font-medium transition-opacity opacity-0">☁️ מתסנכרן...</div>

        <main id="app-container" class="glass-panel p-6 md:p-10 mb-8 min-h-[400px] flex flex-col justify-center items-center relative overflow-hidden">
            <div class="animate-pulse text-xl text-blue-500 font-bold">טוען סביבת בדיקות...</div>
        </main>

        <section class="glass-panel p-6 opacity-50 pointer-events-none">
            <h2 class="text-xl font-bold text-gray-700 mb-2">אזור פוקימונים (מודגש כחצי שקוף בבדיקות)</h2>
            <div id="pokedex" class="grid grid-cols-4 gap-2"></div>
        </section>
    </div>

    <!-- הפעלת המשחק במצב בדיקות (true) -->
    <script type="module">
        import { initApp } from './game-core.js';
        window.onload = () => { initApp(true); };
    </script>
</body>
</html>
