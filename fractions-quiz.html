<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>בדיקת שאלות שברים - Pokemon Math (Test)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, 'Rubik', sans-serif; background: linear-gradient(135deg,#a1c4fd 0%,#c2e9fb 100%); min-height:100vh; }
    .card { max-width:720px; margin:32px auto; background:rgba(255,255,255,0.95); border-radius:16px; padding:24px; box-shadow:0 8px 30px rgba(0,0,0,0.08); }
    .slice { stroke:#fff; stroke-width:1; }
    .part { fill:#93c5fd; }
    .part-empty { fill:#eef2ff; }
    .option-btn { min-width:90px }
  </style>
</head>
<body>
  <div class="card">
    <div class="flex justify-between items-start gap-4">
      <div>
        <h1 class="text-2xl font-bold text-blue-700">שאלות על שברים - בדיקה מהירה</h1>
        <p class="text-sm text-gray-600">הצג עיגול או מלבן מחולק ונסה לבחור את השבר המתאר את החלק הצבוע.</p>
      </div>
      <div class="flex flex-col gap-2">
        <button id="new-q" class="bg-green-500 text-white px-3 py-2 rounded font-bold">שאלה חדשה</button>
        <button id="auto" class="bg-blue-500 text-white px-3 py-2 rounded">הפעל / עצור אוטו</button>
      </div>
    </div>

    <div id="visual" class="mt-6 flex justify-center items-center">
      <!-- SVG inserted here -->
    </div>

    <div id="options" class="mt-6 grid grid-cols-2 md:grid-cols-4 gap-3"></div>

    <div id="feedback" class="mt-4 h-8 text-lg font-bold text-center"></div>

    <div class="mt-6 text-sm text-gray-500">איך לבדוק במהירות: פשוט לחץ על "שאלה חדשה" או הפעל "אוטו" כדי לראות שאלות רצופות. הקובץ נמצא ב-root: /fractions-quiz.html</div>
  </div>

  <script>
    const visual = document.getElementById('visual');
    const optionsDiv = document.getElementById('options');
    const feedback = document.getElementById('feedback');
    const newQBtn = document.getElementById('new-q');
    const autoBtn = document.getElementById('auto');

    let autoTimer = null;

    function gcd(a,b){ return b===0? a : gcd(b, a%b); }

    function clearVisual(){ visual.innerHTML=''; optionsDiv.innerHTML=''; feedback.innerText=''; }

    function simplify(n,d){ const g = gcd(n,d); return {n: n/g, d: d/g}; }

    function fracToStr(n,d){ return `${n}/${d}`; }

    function drawCircle(den, colored){
      const size = 260;
      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS,'svg');
      svg.setAttribute('width', size);
      svg.setAttribute('height', size);
      svg.setAttribute('viewBox', `0 0 ${size} ${size}`);

      const cx = size/2, cy = size/2, r = size*0.42;
      for(let i=0;i<den;i++){
        const a1 = (i/den) * Math.PI*2 - Math.PI/2;
        const a2 = ((i+1)/den) * Math.PI*2 - Math.PI/2;
        const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
        const x2 = cx + r*Math.cos(a2), y2 = cy + r*Math.sin(a2);
        const large = 0; // always small arc because slice less than 180 deg for den>=2
        const path = document.createElementNS(svgNS,'path');
        const isColored = i < colored;
        const d = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;
        path.setAttribute('d', d);
        path.setAttribute('class', 'slice');
        path.setAttribute('fill', isColored ? '#60a5fa' : '#eef2ff');
        svg.appendChild(path);
      }
      // outer circle border
      const circ = document.createElementNS(svgNS,'circle');
      circ.setAttribute('cx',cx); circ.setAttribute('cy',cy); circ.setAttribute('r', r);
      circ.setAttribute('fill','none'); circ.setAttribute('stroke','#1e40af'); circ.setAttribute('stroke-width','3');
      svg.appendChild(circ);
      visual.appendChild(svg);
    }

    function drawRect(den, colored){
      const width = 320, height = 180;
      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS,'svg');
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      const w = width/den;
      for(let i=0;i<den;i++){
        const rect = document.createElementNS(svgNS,'rect');
        rect.setAttribute('x', i*w+4);
        rect.setAttribute('y', 8);
        rect.setAttribute('width', w-8);
        rect.setAttribute('height', height-16);
        rect.setAttribute('rx',8);
        rect.setAttribute('fill', i<colored ? '#60a5fa' : '#eef2ff');
        rect.setAttribute('stroke','#1e40af');
        rect.setAttribute('stroke-width',2);
        svg.appendChild(rect);
      }
      visual.appendChild(svg);
    }

    function generateQuestion(){
      clearVisual();
      const denom = Math.min(10, Math.max(2, Math.floor(Math.random()*9)+2)); // 2..10
      const colored = Math.floor(Math.random()*(denom-1))+1; // 1..denom-1
      const shapeIsCircle = Math.random()>0.4; // more variety: ~60% circle

      // draw
      if(shapeIsCircle) drawCircle(denom, colored);
      else drawRect(denom, colored);

      // prepare options: correct = colored/denom (not simplified, to match visual parts)
      const correct = {n: colored, d: denom};

      let opts = new Set();
      opts.add(fracToStr(correct.n, correct.d));

      // Add distractors: change numerator or denominator or both, ensure not equal
      while(opts.size < 4){
        const type = Math.random();
        let n = colored, d = denom;
        if(type < 0.4){ // numerator off
          n = Math.max(1, Math.min(d-1, colored + (Math.random()>0.5?1:-1) * (Math.floor(Math.random()*2)+1)));
        } else if(type < 0.8){ // denominator off
          d = Math.max(n+1, Math.min(10, denom + (Math.random()>0.5?1:-1) * (Math.floor(Math.random()*2)+1)));
          n = Math.min(n, d-1);
        } else { // both changed
          d = Math.max(2, Math.min(10, Math.floor(Math.random()*9)+2));
          n = Math.floor(Math.random()*(d-1))+1;
        }
        opts.add(fracToStr(n,d));
        if(opts.size > 20) break;
      }

      const arr = Array.from(opts).sort(() => 0.5 - Math.random());

      arr.forEach(o => {
        const btn = document.createElement('button');
        btn.className = 'option-btn bg-white border rounded px-3 py-2 shadow font-bold hover:bg-blue-50';
        btn.innerText = o;
        btn.onclick = () => checkAnswer(o, correct);
        optionsDiv.appendChild(btn);
      });

      feedback.innerText = '';
    }

    function checkAnswer(choiceStr, correct){
      // parse choice
      const [cn, cd] = choiceStr.split('/').map(Number);
      const correctStr = `${correct.n}/${correct.d}`;
      if(choiceStr === correctStr){
        feedback.innerText = 'נכון! 👏';
        feedback.style.color = '#16a34a';
      } else {
        feedback.innerText = 'אופס — לא נכון, נסה שוב';
        feedback.style.color = '#dc2626';
      }
    }

    newQBtn.addEventListener('click', generateQuestion);
    autoBtn.addEventListener('click', ()=>{
      if(autoTimer){ clearInterval(autoTimer); autoTimer = null; autoBtn.innerText = 'הפעל / עצור אוטו'; }
      else { autoTimer = setInterval(generateQuestion, 1400); autoBtn.innerText = 'עצור אוטו'; }
    });

    // start with first question
    generateQuestion();
  </script>
</body>
</html>
