    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .bounce-in {
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .shake {
            animation: shake 0.4s ease-in-out both;
        }
        .shake-hard {
            animation: shakeHard 0.2s ease-in-out infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        @keyframes shakeHard {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-15px) rotate(-10deg); }
            75% { transform: translateX(15px) rotate(10deg); }
        }

        /* Added for Booster Pack Animation */
        .booster-pack {
            width: 160px; height: 240px;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            overflow: hidden;
            border: 4px solid rgba(255,255,255,0.5);
            z-index: 10;
        }
        .booster-pack:hover { transform: translateY(-10px) scale(1.05); }
        .booster-pack::after {
            content: ''; position: absolute; top: -100%; left: -100%; width: 300%; height: 300%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(45deg); animation: shine 3s infinite;
        }
        @keyframes shine { 0% { left: -100%; } 100% { left: 100%; } }
        .pack-basic { background: linear-gradient(135deg, #9ca3af, #6b7280); color: white; }
        .pack-super { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; }
        .pack-ultra { background: linear-gradient(135deg, #eab308, #b45309); color: white; }
        .pack-title { font-size: 24px; font-weight: bold; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.5); z-index: 2; }
        
        .rip-open { animation: ripOpen 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes ripOpen {
            0% { transform: scale(1) rotate(0deg); opacity: 1; filter: brightness(1); }
            40% { transform: scale(1.2) rotate(15deg); filter: brightness(2); }
            100% { transform: scale(0) rotate(-20deg); opacity: 0; filter: brightness(0); }

        async function loadUserData() {
            let loadedData = null;
            
            // 1. קריאת נתונים מהשמירה המקומית (LocalStorage)
            const localDataRaw = localStorage.getItem('pokemonMathSave');
            if (localDataRaw) {
                try { loadedData = JSON.parse(localDataRaw); } catch(e) {}
            }
            
            // 2. סנכרון מול הענן אם קיים חיבור פעיל
            if (db && userId) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'gameData', 'save');
                    const snap = await getDoc(docRef);
                    if (snap.exists()) {
                        loadedData = snap.data(); // הענן מקבל עדיפות ודורס את המקומי
                    } else if (loadedData) {
                        // אם יש לנו מידע מקומי (למשל ממשחק קודם) ואין ענן, נגבה את המידע לענן
                        await setDoc(docRef, loadedData);
                    }
                } catch (e) { console.error("Error loading data from cloud", e); }
            }

            // 3. החלת המידע שנמצא
            if (loadedData) {
                state.score = loadedData.score || 0;
                state.pokemons = loadedData.pokemons || [];
                state.mistakes = loadedData.mistakes || {};
                state.setsCompleted = loadedData.setsCompleted || 0;
                state.correctSinceLastPokemon = loadedData.correctSinceLastPokemon || 0;
            }
            
            updatePokedex();
            scoreDisplay.innerText = state.score;
        }

        async function saveUserData() {
            const dataToSave = {
                score: state.score,
                pokemons: state.pokemons,
                mistakes: state.mistakes,
                setsCompleted: state.setsCompleted,
                correctSinceLastPokemon: state.correctSinceLastPokemon
            };

            localStorage.setItem('pokemonMathSave', JSON.stringify(dataToSave));

            if (db && userId) {
                syncIndicator.style.opacity = '1';
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'gameData', 'save');
                    await setDoc(docRef, dataToSave);
                } catch (e) { console.error("Error saving data to cloud", e); }
                setTimeout(() => { syncIndicator.style.opacity = '0'; }, 1000);
            }
        }

        async function initApp() {
            try {
                const localDataRaw = localStorage.getItem('pokemonMathSave');
                let loadedLocal = false;
                if (localDataRaw) {
                    try { 
                        const d = JSON.parse(localDataRaw);
                        state.score = d.score || 0;
                        state.pokemons = d.pokemons || [];
                        state.mistakes = d.mistakes || {};
                        state.setsCompleted = d.setsCompleted || 0;
                        state.correctSinceLastPokemon = d.correctSinceLastPokemon || 0;
                        loadedLocal = true;
                    } catch(e) {}
                }
                
                if (firebaseConfig) {
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);
                    if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);
                    else await signInAnonymously(auth);
                    
                    userId = auth.currentUser.uid;
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'gameData', 'save');
                    const snap = await getDoc(docRef);
                    if (snap.exists()) {
                        const cloudData = snap.data();
                        state.score = cloudData.score || 0;
                        state.pokemons = cloudData.pokemons || [];
                        state.mistakes = cloudData.mistakes || {};
                        state.setsCompleted = cloudData.setsCompleted || 0;
                        state.correctSinceLastPokemon = cloudData.correctSinceLastPokemon || 0;
                    } else if (loadedLocal) {
                        await setDoc(docRef, JSON.parse(localDataRaw));
                    }
                }
            } catch (e) { 
                console.error("Init or sync failed, using local logic", e); 
            }

            scoreDisplay.innerText = state.score;
            window.startRandomSet();
        }

        function getMistakePair() {
            const keys = Object.keys(state.mistakes);
            if(keys.length === 0) return null;
            // Get mistakes that still need correction

            if(validKeys.length === 0) return null;
            
            // Clean up cleared mistakes

            saveUserData();

            if(validKeys.length === 0) return null;
            const chosen = validKeys[randomInt(0, validKeys.length - 1)];
            const [a, b] = chosen.split('_').map(Number);
            return { a, b };
        }

        function generateLongMathProblem() {
            const isAddition = Math.random() > 0.5;
            const len1 = randomInt(3, 5);
            const len2 = randomInt(3, len1); 
            
            // מספרים ללא אפסים כדי למנוע הלוואות שרשרת מורכבות מדי בשלב זה
            let n1Str = '';
            for(let i=0; i<len1; i++) n1Str += randomInt(1, 9).toString();
            let n1 = parseInt(n1Str);
            
            let n2Str = '';
            for(let i=0; i<len2; i++) n2Str += randomInt(1, 9).toString();
            let n2 = parseInt(n2Str);

            if (!isAddition && n1 < n2) { let temp = n1; n1 = n2; n2 = temp; }
            
            let s1 = n1.toString().split('').reverse().map(Number);
            let s2 = n2.toString().split('').reverse().map(Number);
            
            const maxLen = Math.max(s1.length, s2.length);
            let steps = [];
            let gridCols = maxLen;
            
            if (isAddition) {
                let carry = 0;
                for (let i = 0; i < maxLen; i++) {
                    let d1 = s1[i] || 0;
                    let d2 = s2[i] || 0;
                    let sum = d1 + d2 + carry;
                    steps.push({ type: 'result', col: i, expected: sum % 10 });
                    carry = Math.floor(sum / 10);
                    if (carry > 0) steps.push({ type: 'carry', col: i + 1, expected: carry });
                }
                if (carry > 0) { steps.push({ type: 'result', col: maxLen, expected: carry }); gridCols = maxLen + 1; }
            } else {
                let currentS1 = [...s1];
                for (let i = 0; i < maxLen; i++) {
                    let v1 = currentS1[i] || 0;
                    let v2 = s2[i] || 0;
                    if (v1 < v2) {
                        currentS1[i+1] -= 1;
                        steps.push({ type: 'borrow', col: i+1, expected: currentS1[i+1] });
                        steps.push({ type: 'result', col: i, expected: (v1 + 10) - v2 });
                    } else {
                        steps.push({ type: 'result', col: i, expected: v1 - v2 });
                    }
                }
            }
            
            return { op: isAddition ? '+' : '-', n1, n2, s1, s2, steps, gridCols };
        }
