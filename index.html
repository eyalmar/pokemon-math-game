<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>אתגר החידון והפוקימונים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .bounce-in {
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .shake {
            animation: shake 0.4s ease-in-out both;
        }
        .shake-hard {
            animation: shakeHard 0.2s ease-in-out infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        @keyframes shakeHard {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-15px) rotate(-10deg); }
            75% { transform: translateX(15px) rotate(10deg); }
        }

        /* Added for Booster Pack Animation */
        .booster-pack {
            width: 160px; height: 240px;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            overflow: hidden;
            border: 4px solid rgba(255,255,255,0.5);
            z-index: 10;
        }
        .booster-pack:hover { transform: translateY(-10px) scale(1.05); }
        .booster-pack::after {
            content: ''; position: absolute; top: -100%; left: -100%; width: 300%; height: 300%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(45deg); animation: shine 3s infinite;
        }
        @keyframes shine { 0% { left: -100%; } 100% { left: 100%; } }
        .pack-basic { background: linear-gradient(135deg, #9ca3af, #6b7280); color: white; }
        .pack-super { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; }
        .pack-ultra { background: linear-gradient(135deg, #eab308, #b45309); color: white; }
        .pack-title { font-size: 24px; font-weight: bold; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.5); z-index: 2; }
        
        .rip-open { animation: ripOpen 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes ripOpen {
            0% { transform: scale(1) rotate(0deg); opacity: 1; filter: brightness(1); }
            40% { transform: scale(1.2) rotate(15deg); filter: brightness(2); }
            100% { transform: scale(0) rotate(-20deg); opacity: 0; filter: brightness(0); }
        }

        /* TCG Card flip animation */
        .tcg-card-container { perspective: 1000px; width: 140px; height: 196px; margin: 0 10px; cursor: pointer; }
        .tcg-card-inner { width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; position: relative; }
        .tcg-card-container.flipped .tcg-card-inner { transform: rotateY(180deg); }
        .tcg-card-cover, .tcg-card-reveal { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; border-radius: 12px; box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .tcg-card-cover { background: repeating-linear-gradient(45deg, #2563eb, #2563eb 10px, #1e40af 10px, #1e40af 20px); border: 8px solid #fcd34d; display: flex; align-items: center; justify-conten[...]
        .tcg-card-cover::after { content: '⭐'; font-size: 40px; }
        .tcg-card-reveal { background: white; transform: rotateY(180deg); display: flex; flex-direction: column; align-items: center; justify-content: center; border: 4px solid; padding: 10px; }

        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type="number"] { -moz-appearance: textfield; }

        .pokemon-card {
            background: white;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .pokemon-card:hover { transform: translateY(-5px); }
        
        .rarity-common { border-bottom: 4px solid #9ca3af; }
        .rarity-rare { border-bottom: 4px solid #3b82f6; background: #eff6ff; }
        .rarity-legendary { border-bottom: 4px solid #eab308; background: #fefce8; box-shadow: 0 0 15px rgba(234,179,8,0.3); }

        .match-item {
            background: white;
            border: 3px solid #e5e7eb;
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 1.25rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            z-index: 10;
        }
        .match-item:hover { border-color: #93c5fd; transform: scale(1.05); }
        .match-item.selected { border-color: #3b82f6; background: #eff6ff; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .match-item.solved {
            border-color: #22c55e; background: #f0fdf4; color: #15803d;
            cursor: default; pointer-events: none; opacity: 0.8;
        }
        /* Fraction visuals used in the integrated fraction quiz */
        .fraction-visual { display:flex; justify-content:center; align-items:center; padding:12px 0; }
        .fraction-option { min-width:90px; }
    </style>
</head>
<body class="text-gray-800">

    <div class="w-full max-w-2xl mx-auto">
        <header class="flex flex-wrap justify-between items-center mb-6 glass-panel p-4 gap-4">
            <div class="flex items-center gap-3">
                <h1 class="text-2xl font-bold text-blue-600">חידון הכפל והפוקימונים</h1>
                <div id="timer-display" class="hidden text-base font-bold bg-purple-100 text-purple-800 px-3 py-1.5 rounded-full shadow-inner flex items-center gap-1">
                    ⏱️ <span id="time-text">00:00</span>
                </div>
            </div>
            <div class="text-lg font-bold bg-blue-100 text-blue-800 px-4 py-2 rounded-full shadow-inner flex flex-col items-center">
                <span>⭐ <span id="score-display">0</span></span>
                <span class="text-xs text-blue-600">נקודות</span>
            </div>
        </header>

        <div id="cloud-sync-indicator" class="text-center text-xs text-gray-500 mb-2 font-medium transition-opacity opacity-0">
            ☁️ מתסנכרן מול הענן...
        </div>

        <main id="app-container" class="glass-panel p-6 md:p-10 mb-8 min-h-[400px] flex flex-col justify-center items-center relative overflow-hidden">
            <div class="animate-pulse text-xl text-blue-500 font-bold">טוען משחק ושומר נתונים...</div>
        </main>

        <section class="glass-panel p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-700">הפוקימונים שלי (<span id="pokemon-count">0</span>)</h2>
                <button onclick="window.openShop(true)" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 text-sm font-bold py-1 px-3 rounded-full shadow-sm">🛒 חנות חבילות</button>
            </div>
            <p id="pokedex-empty" class="text-center text-gray-500 text-sm mb-2">פתור עוד תרגילים כדי לתפוס פוקימונים!</p>
            <div id="pokedex" class="grid grid-cols-3 md:grid-cols-4 gap-4">
                <!-- Pokedex entries -->
            </div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pokemon-math-v2';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db, auth, userId;
        
        let state = {
            score: 0,
            pokemons: [],
            mistakes: {}, // Format: { "a_b": required_correct_count }
            setsCompleted: 0,
            correctSinceLastPokemon: 0,
            
            // Session logic
            currentSet: [],
            individualQuestions: [],
            matchQuestions: [],
            longMathSet: [],
            triangleSet: [],
            laCurrentStepIndex: 0,
            phase: 'loading', // 'study', 'individual', 'match', 'reward', 'shop', 'long_math', 'triangles'
            currentIndex: 0,
            matchState: { selectedEq: null, selectedAns: null, completedPairs: [] },
            startTime: null,
            timerInterval: null,
            elapsedSeconds: 0
        };

        const rarityLists = {
            common: [1,4,7,10,13,16,19,21,23,25,27,29,32,37,39,41,43,46,50,52,54,58,60,69,74,92,133], // Basic forms
            rare: [2,3,5,6,8,9,31,34,38,45,65,68,89,94,130,131,143,149], // Evolved/Strong
            legendary: [144,145,146,150,151,243,244,245,249,250,251,382,383,384] // Legends
        };

        const container = document.getElementById('app-container');
        const scoreDisplay = document.getElementById('score-display');
        const pokedex = document.getElementById('pokedex');
        const pokedexEmpty = document.getElementById('pokedex-empty');
        const pokemonCount = document.getElementById('pokemon-count');
        const syncIndicator = document.getElementById('cloud-sync-indicator');

        const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

        async function loadUserData() {
            let loadedData = null;
            
            // 1. קריאת נתונים מהשמירה המקומית (LocalStorage)
            const localDataRaw = localStorage.getItem('pokemonMathSave');
            if (localDataRaw) {
                try { loadedData = JSON.parse(localDataRaw); } catch(e) {}
            }
            
            // 2. סנכרון מול הענן אם קיים חיבור פעיל
            if (db && userId) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'gameData', 'save');
                    const snap = await getDoc(docRef);
                    if (snap.exists()) {
                        loadedData = snap.data(); // הענן מקבל עדיפות ודורס את המקומי
                    } else if (loadedData) {
                        // אם יש לנו מידע מקומי (למשל ממשחק קודם) ואין ענן, נגבה את המידע לענן
                        await setDoc(docRef, loadedData);
                    }
                } catch (e) { console.error("Error loading data from cloud", e); }
            }

            // 3. החלת המידע שנמצא
            if (loadedData) {
                state.score = loadedData.score || 0;
                state.pokemons = loadedData.pokemons || [];
                state.mistakes = loadedData.mistakes || {};
                state.setsCompleted = loadedData.setsCompleted || 0;
                state.correctSinceLastPokemon = loadedData.correctSinceLastPokemon || 0;
            }
            
            updatePokedex();
            scoreDisplay.innerText = state.score;
        }

        async function saveUserData() {
            const dataToSave = {
                score: state.score,
                pokemons: state.pokemons,
                mistakes: state.mistakes,
                setsCompleted: state.setsCompleted,
                correctSinceLastPokemon: state.correctSinceLastPokemon
            };

            localStorage.setItem('pokemonMathSave', JSON.stringify(dataToSave));

            if (db && userId) {
                syncIndicator.style.opacity = '1';
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'gameData', 'save');
                    await setDoc(docRef, dataToSave);
                } catch (e) { console.error("Error saving data to cloud", e); }
                setTimeout(() => { syncIndicator.style.opacity = '0'; }, 1000);
            }
        }

        async function initApp() {
            try {
                const localDataRaw = localStorage.getItem('pokemonMathSave');
                let loadedLocal = false;
                if (localDataRaw) {
                    try { 
                        const d = JSON.parse(localDataRaw);
                        state.score = d.score || 0;
                        state.pokemons = d.pokemons || [];
                        state.mistakes = d.mistakes || {};
                        state.setsCompleted = d.setsCompleted || 0;
                        state.correctSinceLastPokemon = d.correctSinceLastPokemon || 0;
                        loadedLocal = true;
                    } catch(e) {}
                }
                
                if (firebaseConfig) {
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);
                    if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);
                    else await signInAnonymously(auth);
                    
                    userId = auth.currentUser.uid;
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'gameData', 'save');
                    const snap = await getDoc(docRef);
                    if (snap.exists()) {
                        const cloudData = snap.data();
                        state.score = cloudData.score || 0;
                        state.pokemons = cloudData.pokemons || [];
                        state.mistakes = cloudData.mistakes || {};
                        state.setsCompleted = cloudData.setsCompleted || 0;
                        state.correctSinceLastPokemon = cloudData.correctSinceLastPokemon || 0;
                    } else if (loadedLocal) {
                        await setDoc(docRef, JSON.parse(localDataRaw));
                    }
                }
            } catch (e) { 
                console.error("Init or sync failed, using local logic", e); 
            }
            updatePokedex();
            scoreDisplay.innerText = state.score;
            window.startRandomSet();
        }

        function getMistakePair() {
            const keys = Object.keys(state.mistakes);
            if(keys.length === 0) return null;
            // Get mistakes that still need correction
            const validKeys = keys.filter(k => state.mistakes[k] > 0);
            if(validKeys.length === 0) return null;
            
            // Clean up cleared mistakes
            keys.forEach(k => { if(state.mistakes[k] <= 0) delete state.mistakes[k]; });
            saveUserData();

            if(validKeys.length === 0) return null;
            const chosen = validKeys[randomInt(0, validKeys.length - 1)];
            const [a, b] = chosen.split('_').map(Number);
            return { a, b };
        }

        window.startRandomSet = function() {
            // now includes fractions-set as one of the random possibilities
            const rand = randomInt(0, 3);
            if (rand === 0) window.generateNewSet();
            else if (rand === 1) window.generateLongMathSet();
            else if (rand === 2) window.generateTriangleSet();
            else window.generateFractionsSet();
        }

        function generateLongMathProblem() {
            const isAddition = Math.random() > 0.5;
            const len1 = randomInt(3, 5);
            const len2 = randomInt(3, len1); 
            
            // מספרים ללא אפסים כדי למנוע הלוואות שרשרת מורכבות מדי בשלב זה
            let n1Str = '';
            for(let i=0; i<len1; i++) n1Str += randomInt(1, 9).toString();
            let n1 = parseInt(n1Str);
            
            let n2Str = '';
            for(let i=0; i<len2; i++) n2Str += randomInt(1, 9).toString();
            let n2 = parseInt(n2Str);

            if (!isAddition && n1 < n2) { let temp = n1; n1 = n2; n2 = temp; }
            
            let s1 = n1.toString().split('').reverse().map(Number);
            let s2 = n2.toString().split('').reverse().map(Number);
            
            const maxLen = Math.max(s1.length, s2.length);
            let steps = [];
            let gridCols = maxLen;
            
            if (isAddition) {
                let carry = 0;
                for (let i = 0; i < maxLen; i++) {
                    let d1 = s1[i] || 0;
                    let d2 = s2[i] || 0;
                    let sum = d1 + d2 + carry;
                    steps.push({ type: 'result', col: i, expected: sum % 10 });
                    carry = Math.floor(sum / 10);
                    if (carry > 0) steps.push({ type: 'carry', col: i + 1, expected: carry });
                }
                if (carry > 0) { steps.push({ type: 'result', col: maxLen, expected: carry }); gridCols = maxLen + 1; }
            } else {
                let currentS1 = [...s1];
                for (let i = 0; i < maxLen; i++) {
                    let v1 = currentS1[i] || 0;
                    let v2 = s2[i] || 0;
                    if (v1 < v2) {
                        currentS1[i+1] -= 1;
                        steps.push({ type: 'borrow', col: i+1, expected: currentS1[i+1] });
                        steps.push({ type: 'result', col: i, expected: (v1 + 10) - v2 });
                    } else {
                        steps.push({ type: 'result', col: i, expected: v1 - v2 });
                    }
                }
            }
            
            return { op: isAddition ? '+' : '-', n1, n2, s1, s2, steps, gridCols };
        }

        window.generateLongMathSet = function() {
            state.longMathSet = [
                generateLongMathProblem(),
                generateLongMathProblem()
            ];
            state.phase = 'long_math';
            state.currentIndex = 0;
            
            state.elapsedSeconds = 0;
            document.getElementById('timer-display').classList.remove('hidden');
            updateTimerDisplay();
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                state.elapsedSeconds++;
                updateTimerDisplay();
            }, 1000);
            
            render();
        };

        const triangleTemplates = [
            // מקוריים
            { points: "100,56 40,160 160,160", labels: ["חד זווית", "שווה צלעות"], marks: `<line x1="100" y1="152" x2="100" y2="168" stroke="#ef4444" stroke-width="3"/><line x1="63" y1[...]
            { points: "40,160 160,160 40,40", labels: ["ישר זווית", "שווה שוקיים"], marks: `<line x1="100" y1="152" x2="100" y2="168" stroke="#ef4444" stroke-width="3"/><line x1="32"[...]
            { points: "40,160 160,160 40,80", labels: ["ישר זווית", "שונה צלעות"], marks: `<polyline points="40,140 60,140 60,160" fill="none" stroke="#3b82f6" stroke-width="2"/>` },
            { points: "100,80 20,120 180,120", labels: ["קהה זווית", "שווה שוקיים"], marks: `<line x1="56" y1="93" x2="64" y2="107" stroke="#ef4444" stroke-width="3"/><line x1="136" [...]
            { points: "140,60 20,140 180,140", labels: ["קהה זווית", "שונה צלעות"], marks: `` },
            { points: "100,20 60,160 140,160", labels: ["חד זווית", "שווה שוקיים"], marks: `<line x1="72" y1="88" x2="88" y2="92" stroke="#ef4444" stroke-width="3"/><line x1="112" y1=[...]
            { points: "80,20 20,160 160,160", labels: ["חד זווית", "שונה צלעות"], marks: `` },
            
            // חדשים: מסובבים והפוכים למניעת קיבעון
            // שווה צלעות הפוך
            { points: "40,56 160,56 100,160", labels: ["חד זווית", "שווה צלעות"], marks: `<line x1="100" y1="48" x2="100" y2="64" stroke="#ef4444" stroke-width="3"/><line x1="63" y1="1[...]
            // ישר זווית שווה שוקיים (זווית ישרה למטה מימין)
            { points: "40,160 160,160 160,40", labels: ["ישר זווית", "שווה שוקיים"], marks: `<line x1="100" y1="152" x2="100" y2="168" stroke="#ef4444" stroke-width="3"/><line x1="15[...]
            // ישר זווית שונה צלעות (זווית ישרה למעלה משמאל)
            { points: "40,40 160,40 40,120", labels: ["ישר זווית", "שונה צלעות"], marks: `<polyline points="40,60 60,60 60,40" fill="none" stroke="#3b82f6" stroke-width="2"/>` },
            // קהה זווית שווה שוקיים מצביע שמאלה
            { points: "40,100 120,40 120,160", labels: ["קהה זווית", "שווה שוקיים"], marks: `<line x1="74" y1="62" x2="86" y2="78" stroke="#ef4444" stroke-width="3"/><line x1="74" y1[...]
            // קהה זווית שונה צלעות הפוך
            { points: "20,140 180,140 160,80", labels: ["קהה זווית", "שונה צלעות"], marks: `` },
            // חד זווית שווה שוקיים מצביע ימינה
            { points: "160,100 40,40 40,160", labels: ["חד זווית", "שווה שוקיים"], marks: `<line x1="96" y1="78" x2="104" y2="62" stroke="#ef4444" stroke-width="3"/><line x1="96" y1="[...]
            // חד זווית שונה צלעות בזווית מוזרה
            { points: "60,40 140,160 20,120", labels: ["חד זווית", "שונה צלעות"], marks: `` }
        ];

        window.generateTriangleSet = function() {
            let shuffled = [...triangleTemplates].sort(() => 0.5 - Math.random()).slice(0, 4);
            state.triangleSet = shuffled;
            state.phase = 'triangles';
            state.currentIndex = 0;
            
            state.elapsedSeconds = 0;
            document.getElementById('timer-display').classList.remove('hidden');
            updateTimerDisplay();
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => { state.elapsedSeconds++; updateTimerDisplay(); }, 1000);
            
            render();
        };

        window.generateNewSet = function() {
            let mults = [];
            let usedAnswers = new Set();
            let usedPairs = new Set(); // Prevent reversed duplicates like 6x7 and 7x6

            // 1. Inject up to 2 mistakes for spaced repetition
            let mistakeCount = 0;
            for(let i=0; i<2; i++) {
                const mistake = getMistakePair();
                if(mistake) {
                    const ans = mistake.a * mistake.b;
                    const key1 = `${mistake.a}_${mistake.b}`;
                    const key2 = `${mistake.b}_${mistake.a}`;
                    
                    if(!usedPairs.has(key1)) {
                        usedPairs.add(key1); usedPairs.add(key2); usedAnswers.add(ans);
                        mults.push({ 
                            id: 'm'+mults.length, isDiv: false, 
                            a: mistake.a, b: mistake.b, ans, 
                            displayEq: `<span>${mistake.a}</span> <span class="text-blue-500">×</span> <span>${mistake.b}</span> <span class="text-gray-400">=</span>`, 
                            correct: ans, corePair: key1
                        });
                        mistakeCount++;
                    }
                }
            }

            // 2. Fill the rest of the 5 questions randomly
            while (mults.length < 5) {
                const a = randomInt(2, 10);
                const b = randomInt(2, 10);
                const ans = a * b;
                const key1 = `${a}_${b}`;
                const key2 = `${b}_${a}`;
                
                if (!usedAnswers.has(ans) && !usedPairs.has(key1)) {
                    usedAnswers.add(ans); usedPairs.add(key1); usedPairs.add(key2);
                    mults.push({ 
                        id: 'm'+mults.length, isDiv: false, a, b, ans, 
                        displayEq: `<span>${a}</span> <span class="text-blue-500">×</span> <span>${b}</span> <span class="text-gray-400">=</span>`, 
                        correct: ans, corePair: key1
                    });
                }
            }
            
            // 3. Generate 3 division questions from the multiplication set
            let divs = [...mults].sort(() => 0.5 - Math.random()).slice(0, 3);
            divs = divs.map((q, i) => ({
                id: 'd'+i, isDiv: true, a: q.a, b: q.b, ans: q.ans, 
                displayEq: `<span>${q.ans}</span> <span class="text-blue-500">÷</span> <span>${q.a}</span> <span class="text-gray-400">=</span>`, 
                correct: q.b, corePair: q.corePair
            }));
            
            let allQ = [...mults, ...divs];
            
            // 4. Formatting: 4 Choice, 2 Input, 2 Match
            let formats = ['choice', 'choice', 'choice', 'choice', 'open', 'open', 'match', 'match'];
            formats.sort(() => 0.5 - Math.random());
            
            state.individualQuestions = [];
            state.matchQuestions = [];
            
            allQ.forEach((q, i) => {
                q.format = formats[i];
                if (q.format === 'match') state.matchQuestions.push(q);
                else state.individualQuestions.push(q);
            });
            
            state.currentSet = mults;
            state.phase = 'study';
            state.currentIndex = 0;
            render();
        };

        function handleQuestionResult(corePair, isCorrect) {
            const parts = corePair.split('_').map(Number).sort((a,b)=>a-b);
            const key = `${parts[0]}_${parts[1]}`;

            if (isCorrect) {
                if (state.mistakes[key]) {
                    state.mistakes[key]--;
                    if (state.mistakes[key] <= 0) delete state.mistakes[key];
                }
            } else {
                // If wrong, needs 3 correct answers to clear from repetition pool (max 5)
                state.mistakes[key] = Math.min((state.mistakes[key] || 0) + 3, 5);
            }
            saveUserData();
        }

        function render() {
            container.innerHTML = '';
            if (state.phase === 'study') renderStudyPhase();
            else if (state.phase === 'individual') {
                const q = state.individualQuestions[state.currentIndex];
                if (q.format === 'choice') renderChoiceQuestion(q, state.currentIndex, state.individualQuestions.length);
                else renderInputQuestion(q, state.currentIndex, state.individualQuestions.length);
            } 
            else if (state.phase === 'match') renderMatchGame();
            else if (state.phase === 'shop') renderShop();
            else if (state.phase === 'long_math') renderLongMath();
            else if (state.phase === 'triangles') renderTriangles();
            else if (state.phase === 'fractions') renderFractions();
        }

            const correctAnswer = parseInt(correctAnswerStr);

            }
        }

        function generateDistractors(q) {
            let options = new Set();
            options.add(q.correct);
            if (q.isDiv) {
                const mistakes = [q.correct + 1, q.correct - 1, q.a, q.ans, q.correct + 2, q.correct - 2];
                mistakes.forEach(m => { if (m > 0 && !options.has(m) && options.size < 10) options.add(m); });
            } else {
                const mistakes = [ q.correct + q.a, q.correct - q.a, q.correct + q.b, q.correct - q.b, (q.a+1) * q.b, q.a * (q.b+1), q.correct + 10, q.correct - 10, parseInt(`${q.correct}`.split('').r[...]
                mistakes.forEach(m => { if (m > 0 && !options.has(m) && options.size < 10 && !isNaN(m)) options.add(m); });
            }
            while (options.size < 10) {
                let r = q.correct + randomInt(-15, 15);
                if (r > 0 && !options.has(r)) options.add(r);
            }
            return Array.from(options).slice(0, 10).sort(() => 0.5 - Math.random());
        }

        function resizeCanvas() {

        window.handleMatchClick = function(element) {
            if (element.classList.contains('solved')) return;
            const type = element.dataset.type;
            const stateRef = state.matchState;
            
            if (element.classList.contains('selected')) {
                element.classList.remove('selected');
                if (type === 'eq') stateRef.selectedEq = null; else stateRef.selectedAns = null;
                return;
            }

            Array.from(element.parentElement.children).forEach(child => {
                if (!child.classList.contains('solved')) child.classList.remove('selected');
            });
            
            element.classList.add('selected');
            if (type === 'eq') stateRef.selectedEq = element; else stateRef.selectedAns = element;

            if (stateRef.selectedEq && stateRef.selectedAns) window.checkMatch();
        }

        window.checkMatch = function() {
            const eq = state.matchState.selectedEq;
            const ans = state.matchState.selectedAns;
            const feedback = document.getElementById('match-feedback');
            const corePair = eq.dataset.core;

            if (eq.dataset.val === ans.dataset.val) {
                handleQuestionResult(corePair, true);
                eq.classList.remove('selected'); ans.classList.remove('selected');
                eq.classList.add('solved'); ans.classList.add('solved');
                
                state.matchState.completedPairs.push({ eq: eq.id, ans: ans.id });
                drawLines();
                feedback.innerHTML = '<span class="text-green-500">נכון מאוד!</span>';
                
                state.matchState.selectedEq = null; state.matchState.selectedAns = null;

                if (state.matchState.completedPairs.length === state.matchQuestions.length) {
                    feedback.innerHTML = '<span class="text-green-500">סיימת את כולם, אלוף! 👏</span>';
                    window.removeEventListener('resize', resizeCanvas);
                    setTimeout(() => {
                        state.score += state.matchQuestions.length;
                        state.correctSinceLastPokemon += state.matchQuestions.length;
                        scoreDisplay.innerText = state.score;

                        checkRewardOrAdvance(true);

            } else {
                handleQuestionResult(corePair, false); // Log mistake
                feedback.innerHTML = '<span class="text-red-500">נסה שוב! תמתח קו אחר.</span>';
                eq.classList.remove('selected'); ans.classList.remove('selected');
                eq.classList.add('animate-pulse'); ans.classList.add('animate-pulse');
                setTimeout(() => { eq.classList.remove('animate-pulse'); ans.classList.remove('animate-pulse'); }, 500);
                state.matchState.selectedEq = null; state.matchState.selectedAns = null;
            }
        }

                    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);

                }
            });
        }
