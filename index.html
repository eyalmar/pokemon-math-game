<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>אתגר החידון והפוקימונים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="firebase-config.js"></script>
    <!-- כאן נכנסים הסטיילים הרגילים שלך כמו בפעם הקודמת (booster-pack, bounce-in וכו') -->
    <style>
        body { font-family: 'Rubik', sans-serif; background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); min-height: 100vh; margin: 0; padding: 10px; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .bounce-in { animation: bounceIn 0.6s both; }
        @keyframes bounceIn { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="text-gray-800 flex flex-col items-center">

    <div class="w-full max-w-2xl mx-auto">
        <header class="flex flex-wrap justify-between items-center mb-6 glass-panel p-4 gap-4">
            <div class="flex flex-col gap-2">
                <div class="flex items-center gap-3">
                    <h1 class="text-2xl font-bold text-blue-600">האתגר היומי</h1>
                    <div id="timer-display" class="hidden text-base font-bold bg-purple-100 text-purple-800 px-3 py-1.5 rounded-full shadow-inner flex items-center gap-1">⏱️ <span id="time-text">00:00</span></div>
                </div>
                <div class="text-sm font-bold text-gray-600 bg-gray-100 px-3 py-1 rounded-full flex items-center gap-1 border border-gray-200">
                    👤 <span id="player-name-display">...</span>
                </div>
            </div>
            
            <div class="text-lg font-bold bg-blue-100 text-blue-800 px-4 py-2 rounded-full shadow-inner flex flex-col items-center">
                <span>⭐ <span id="score-display">0</span></span>
                <span class="text-xs text-blue-600">נקודות</span>
            </div>
        </header>

        <div id="cloud-sync-indicator" class="text-center text-xs text-gray-500 mb-2 font-medium transition-opacity opacity-0">☁️ מתסנכרן...</div>

        <main id="app-container" class="glass-panel p-6 md:p-10 mb-8 min-h-[400px] flex flex-col justify-center items-center relative overflow-hidden">
            <div class="animate-pulse text-xl text-blue-500 font-bold">טוען משחק...</div>
        </main>

        <section class="glass-panel p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-700">הפוקימונים שלי (<span id="pokemon-count">0</span>)</h2>
            </div>
            <div id="pokedex" class="grid grid-cols-3 md:grid-cols-4 gap-4"></div>
        </section>
    </div>

    <!-- הפעלת המשחק במצב רגיל (false) -->
    <script type="module">
        import { initApp } from './game-core.js';
        window.onload = () => { initApp(false); };
    </script>
</body>
</html>
